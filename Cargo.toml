[package]
name = "dbbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Peer-to-peer database proxy over plain HTTPS (WebSocket / HTTP-SSE)"
license = "Apache-2.0"

[[bin]]
name = "dbbridge"
path = "src/main.rs"

[dependencies]

[features]
default = ["tls", "h2"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs"]
h2 = ["tls", "dep:tokio", "dep:hyper", "dep:tokio-rustls", "dep:tokio-stream"]

[dependencies.rustls]
version = "0.21"
optional = true
features = ["dangerous_configuration"]

[dependencies.rustls-pemfile]
version = "1"
optional = true

[dependencies.rustls-native-certs]
version = "0.6"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util"]
optional = true

[dependencies.hyper]
version = "0.14"
features = ["client", "server", "http2", "stream", "runtime"]
optional = true

[dependencies.tokio-rustls]
version = "0.24"
optional = true

[dependencies.tokio-stream]
version = "0.1"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
